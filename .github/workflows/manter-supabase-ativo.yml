# Evita que o Supabase gratuito pause o banco por falta de uso.
# Roda sozinho a cada 3 dias e faz uma consulta simples no banco.
#
# Antes de funcionar, cadastre dois "secrets" no GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_URL              (a mesma do .env, ex.: https://xxxx.supabase.co)
#     SUPABASE_PUBLISHABLE_KEY  (a chave publicável, a mesma do .env)
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simples no banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltam os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "Resposta do Supabase: $codigo"
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "O Supabase não respondeu como esperado. Veja se o projeto não está pausado."
            exit 1
          fi
